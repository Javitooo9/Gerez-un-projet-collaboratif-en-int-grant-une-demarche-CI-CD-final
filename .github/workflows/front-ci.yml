name: Front Angular CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout du code
        uses: actions/checkout@v4

      - name: 📦 Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: 📥 Installation des dépendances
        run: npm ci
        working-directory: front

      - name: 🏗️ Build de l'application
        run: npm run build
        working-directory: front

      - name: 📂 Sauvegarde du build
        uses: actions/upload-artifact@v4
        with:
          name: front-artifact
          path: front/dist/

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 🛎️ Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Nécessaire pour Sonar

      - name: 📦 Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: 📥 Installation des dépendances
        run: npm ci
        working-directory: front

      - name: 🧪 Run tests et génère le coverage
        run: npm run test -- --no-watch --no-progress --browsers=ChromeHeadless --code-coverage
        working-directory: front
        
      - name: 📂 Sauvegarde Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: front/coverage/bobapp


