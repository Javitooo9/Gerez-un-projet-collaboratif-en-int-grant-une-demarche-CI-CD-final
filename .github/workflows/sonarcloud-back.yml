name: SonarCloud – Back

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sonar:
    name: Analyse Back-end avec SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build and test with Maven & Sonar
        run: mvn clean verify sonar:sonar `
              -Dsonar.projectKey=xavier-ropero:bobapp-backend `
              -Dsonar.organization=xavier-ropero `
              -Dsonar.host.url=https://sonarcloud.io `
              -Dsonar.login=${{ secrets.SONAR_TOKEN }}
