name: SonarCloud – Front

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sonarcloud:
    name: Analyse Front-end avec SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: front

      - name: Run tests & collect coverage
        run: npm run test -- --no-watch --no-progress --browsers=ChromeHeadless --code-coverage
        working-directory: front

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        with:
          organization: xavier-ropero
          projectKey: xavier-ropero:bobapp-frontend    # ← Project Key EXACT
          token: ${{ secrets.SONAR_TOKEN }}
          projectBaseDir: front
          extra_args: |
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=src/app
            -Dsonar.exclusions=**/*.spec.ts
            -Dsonar.tests=src/app
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/bobapp/lcov.info
            -Dsonar.sourceEncoding=UTF-8

