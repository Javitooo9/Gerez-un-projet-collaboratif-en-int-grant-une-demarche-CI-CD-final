# Informations du projet
sonar.projectKey=xavier-ropero:bobapp-backend
sonar.projectName=bobapp-backend
sonar.organization=xavier-ropero
sonar.host.url=https://sonarcloud.io

# Authentification (uniquement si utilisée en local)
sonar.login=${SONAR_TOKEN}

# Sources backend
sonar.sources=back/src/main/java
sonar.tests=back/src/test/java
sonar.java.binaries=back/target/classes
sonar.junit.reportPaths=back/target/surefire-reports
sonar.jacoco.reportPaths=back/target/jacoco.exec
sonar.test.inclusions=**/*Test.java

# (Optionnel) Couverture front si tu analyses aussi Angular
sonar.javascript.lcov.reportPaths=front/coverage/bobapp/lcov.info
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts
